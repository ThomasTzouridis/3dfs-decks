<script>
(function(){var L={"f": "Adele", "l": "Parks", "s": "ANA MARTIN FLOREN"},D='/_pharma/ge-healthcare/deck.html';

}).catch(function(e){document.body.innerHTML='<p style="color:#fff;font:16px Arial;padding:40px">Loading the presentation failed ('+e.message+'). Please reload.</p>'});
})();
